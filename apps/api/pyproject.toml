[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directorylaunch-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.84,<1",
  "asyncpg>=0.30,<1",
  "fastapi==0.134.0",
  "httpx==0.28.1",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.db", "app.routes"]
